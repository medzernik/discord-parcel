[package]
name = "medzernik-discord-parcel"
version = "0.1.0"
edition = "2024"
author = "medzernik"

[dependencies]
dotenv = "0.15"
reqwest = "0.13.3"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0", features = ["serde_derive"] }
serde_json = "1.0"
serenity = "0.12"
thiserror = "2.0"
tokio = { version = "1.52", features = ["full"] }
